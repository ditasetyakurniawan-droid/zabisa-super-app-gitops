automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: zabisa-academic, namespace: zabisa-app}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: zabisa-donation, namespace: zabisa-app}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
