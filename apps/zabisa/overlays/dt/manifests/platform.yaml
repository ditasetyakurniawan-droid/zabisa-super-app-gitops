apiVersion: v1
kind: Namespace
metadata:
  name: zabisa-app
  labels:
    app.kubernetes.io/name: zabisa
    app.kubernetes.io/part-of: zabisa-platform
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: zabisa-api-gateway, namespace: zabisa-app}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: zabisa-identity, namespace: zabisa-app}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: zabisa-content, namespace: zabisa-app}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
