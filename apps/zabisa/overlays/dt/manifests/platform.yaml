automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: zabisa-media, namespace: zabisa-app}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: zabisa-admin-web, namespace: zabisa-app}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: zabisa-identity-migrator, namespace: zabisa-app}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: zabisa-content-migrator, namespace: zabisa-app}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: zabisa-student-migrator, namespace: zabisa-app}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: zabisa-tahfidz-migrator, namespace: zabisa-app}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: zabisa-academic-migrator, namespace: zabisa-app}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: zabisa-donation-migrator, namespace: zabisa-app}
automountServiceAccountToken: false
---
apiVersion: v1
