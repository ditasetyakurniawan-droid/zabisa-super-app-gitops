apiVersion: batch/v1
kind: Job
metadata:
  name: media-migrate
  namespace: zabisa-app
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-5"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app: media-migrate
        tier: migration
        zabisa.network/vault-access: "true"
        zabisa.network/mysql-access: "true"
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/agent-pre-populate-only: "true"
        vault.hashicorp.com/role: app-zabisa-media-migrator-dt
        vault.hashicorp.com/agent-service-account-token-volume-name: vault-token
        vault.hashicorp.com/tls-secret: vault-ca
        vault.hashicorp.com/ca-cert: /vault/tls/ca.crt
        vault.hashicorp.com/tls-server-name: vault.vault.svc
        vault.hashicorp.com/agent-run-as-same-user: "true"
        vault.hashicorp.com/agent-inject-secret-mysql-user: kv/data/zabisa/dt/media/migrator
        vault.hashicorp.com/agent-inject-template-mysql-user: '{{- with secret "kv/data/zabisa/dt/media/migrator" -}}{{ .Data.data.MYSQL_USER }}{{- end }}'
        vault.hashicorp.com/agent-inject-perms-mysql-user: "0400"
        vault.hashicorp.com/agent-inject-secret-mysql-password: kv/data/zabisa/dt/media/migrator
        vault.hashicorp.com/agent-inject-template-mysql-password: '{{- with secret "kv/data/zabisa/dt/media/migrator" -}}{{ .Data.data.MYSQL_PASSWORD }}{{- end }}'
        vault.hashicorp.com/agent-inject-perms-mysql-password: "0400"
    spec:
      serviceAccountName: zabisa-media-migrator
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: migrate
          image: harbor-dt.co.id/devops-apps/zabisa/media:1a9538f3bde7b2902ab8aac4801b7396ffaec923
          imagePullPolicy: IfNotPresent
          env:
            - {name: ENVIRONMENT, value: dt}
            - {name: APP_MODE, value: migrate}
            - {name: MYSQL_HOST, value: db-dt}
            - {name: MYSQL_TLS_MODE, value: verify-ca}
            - {name: MYSQL_TLS_CA_FILE, value: /mysql/tls/ca.pem}
            - {name: MYSQL_USER_FILE, value: /vault/secrets/mysql-user}
            - {name: MYSQL_PASSWORD_FILE, value: /vault/secrets/mysql-password}
          volumeMounts:
            - {name: mysql-ca, mountPath: /mysql/tls, readOnly: true}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            capabilities:
              drop: ["ALL"]
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
      volumes:
        - name: mysql-ca
          secret: {secretName: mysql-ca}
        - name: vault-token
          projected:
            defaultMode: 420
            sources:
              - serviceAccountToken:
                  audience: vault
                  expirationSeconds: 1800
                  path: token
